<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的壁纸</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <h1>我的壁纸</h1>
            <div class="header-actions">
                <button id="btn-refresh" class="btn" title="刷新">🔄 刷新</button>
                <button id="btn-change-now" class="btn btn-primary" title="立即换壁纸">✨ 换一张</button>
                <button id="btn-settings" class="btn" title="设置">⚙️ 设置</button>
            </div>
        </header>

        <div class="app-main">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>分类</h2>
                    <button id="btn-add-category" class="btn-small">+</button>
                </div>
                <ul id="category-list" class="category-list">
                </ul>
            </aside>

            <main class="content">
                <div class="tabs">
                    <button class="tab active" data-tab="local">本地壁纸</button>
                    <button class="tab" data-tab="online">在线壁纸</button>
                </div>

                <div id="local-panel" class="tab-panel active">
                    <div class="toolbar">
                        <div class="toolbar-right">
                            <input type="text" id="search-input" placeholder="搜索壁纸..." class="search-input">
                        </div>
                    </div>
                    <div id="wallpaper-grid" class="wallpaper-grid">
                        <div class="loading">加载中...</div>
                    </div>
                </div>

                <div id="online-panel" class="tab-panel">
                    <div class="toolbar">
                        <div class="toolbar-left">
                            <select id="wallpaper-source" class="select">
                            </select>
                            <select id="online-category" class="select">
                                <option value="all">全部</option>
                                <option value="风景">风景</option>
                                <option value="动漫">动漫</option>
                                <option value="美女">美女</option>
                                <option value="科技">科技</option>
                            </select>
                        </div>
                        <div class="toolbar-right">
                            <span>下载到：</span>
                            <select id="download-to-category" class="select">
                            </select>
                        </div>
                    </div>
                    <div id="online-grid" class="wallpaper-grid masonry">
                        <div class="loading">加载中...</div>
                    </div>
                </div>
            </main>
        </div>

        <footer class="app-footer">
            <span id="wallpaper-count">已下载 0 张壁纸</span>
        </footer>
    </div>

    <div id="preview-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <img id="preview-image" src="" alt="预览">
            <div class="preview-info">
                <h3 id="preview-name"></h3>
                <p id="preview-details"></p>
                <div class="preview-actions">
                    <button id="btn-set-wallpaper" class="btn btn-primary">设为壁纸</button>
                    <button id="btn-delete" class="btn btn-danger">删除</button>
                </div>
            </div>
        </div>
    </div>

    <div id="online-preview-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <img id="online-preview-image" src="" alt="预览">
            <div class="preview-info">
                <h3 id="online-preview-name"></h3>
                <p id="online-preview-details"></p>
                <div class="preview-actions">
                    <button id="btn-online-download" class="btn btn-primary">下载</button>
                    <button id="btn-online-set-wallpaper" class="btn">下载并设为壁纸</button>
                </div>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-content modal-small">
            <span class="modal-close">&times;</span>
            <h2>设置</h2>
            <div class="settings-form">
                <div class="form-group">
                    <label>壁纸存放目录：</label>
                    <input type="text" id="wallpaper-dir-input" class="input" readonly>
                </div>
                <div class="form-group">
                    <label>自动换壁纸：</label>
                    <div class="checkbox-group">
                        <input type="checkbox" id="auto-change-enabled">
                        <span>开启自动换壁纸</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>换壁纸间隔（分钟）：</label>
                    <input type="number" id="auto-change-interval" class="input" min="5" value="1440">
                </div>
                <div class="form-group">
                    <label>换壁纸模式：</label>
                    <select id="auto-change-mode" class="select">
                        <option value="local">使用本地壁纸</option>
                        <option value="online">使用在线随机壁纸</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>换壁纸分类：</label>
                    <select id="auto-change-category" class="select">
                    </select>
                </div>
                <div class="form-group">
                    <label>壁纸文字：</label>
                    <div class="checkbox-group">
                        <input type="checkbox" id="show-quote" checked>
                        <span>显示鼓励语</span>
                    </div>
                </div>
                <button id="btn-save-settings" class="btn btn-primary">保存设置</button>
            </div>
        </div>
    </div>

    <div id="add-category-modal" class="modal">
        <div class="modal-content modal-small">
            <span class="modal-close">&times;</span>
            <h2>添加分类</h2>
            <div class="settings-form">
                <div class="form-group">
                    <label>分类名称：</label>
                    <input type="text" id="new-category-name" class="input" placeholder="请输入分类名称">
                </div>
                <button id="btn-confirm-add-category" class="btn btn-primary">确认</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
